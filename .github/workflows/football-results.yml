name: Football results
on:
  schedule:
    - cron: '50 18 * * *' # 12:20 AM IST
    - cron: '0 */8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-football-feed
  cancel-in-progress: false
jobs:
  settle:
    if: ${{ vars.PUBLIC_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/football-match-lab
          ref: main
          token: ${{ secrets.FOOTBALL_REPO_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install locked Football dependencies
        run: python -m pip install -r requirements.lock
      - name: Reconcile and publish final scores
        env:
          PYTHONPATH: src
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if ! python scripts/refresh_football_results.py > .football-results.log 2>&1; then rm -f .football-results.log; echo "::error::Football results refresh failed; output suppressed."; exit 1; fi
            rm -f .football-results.log
            git add site/history.json
            if git diff --cached --quiet; then echo "No Football history changes."; exit 0; fi
            git commit -m 'Refresh Football final results'
            if git push origin HEAD:main; then echo "Football history published."; exit 0; fi
            sleep 2
          done
          echo "::error::Could not publish Football results."; exit 1
