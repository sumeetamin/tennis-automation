name: Retrain Football model
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-football-feed
  cancel-in-progress: false
jobs:
  train:
    if: ${{ vars.PUBLIC_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/football-match-lab
          ref: main
          token: ${{ secrets.FOOTBALL_REPO_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Train and verify model privately
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: '2'
        run: |
          if ! python -u -m football_lab.cli train > .football-train.log 2>&1; then rm -f .football-train.log; echo "::error::Football model training failed; output suppressed."; exit 1; fi
          rm -f .football-train.log
          python - <<'PY'
          from pathlib import Path
          from football_lab.runtime import load_bundle
          load_bundle(Path('models/football_1x2.joblib'))
          print('Football model artifact verified.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/football_1x2.joblib models/football_1x2.manifest.json reports/model_metrics.json reports/champions_model_metrics.json
          if git diff --cached --quiet; then echo "::error::Training produced no model changes."; exit 1; fi
          git commit -m 'Retrain production Football model'
          # Training may modify additional tracked artifacts that are not published here.
          # Clear those local-only changes before syncing the committed outputs.
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then echo "Football model published."; exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          echo "::error::Could not publish the Football model."; exit 1
