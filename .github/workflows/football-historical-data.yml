name: Build Football historical data
on:
  workflow_dispatch:
    inputs:
      task:
        description: Choose historical dataset or player data collection
        type: choice
        required: true
        options:
          - historical-dataset
          - collect-player-data
permissions:
  contents: read
concurrency:
  group: private-football-feed
  cancel-in-progress: false
jobs:
  maintain:
    if: ${{ vars.PUBLIC_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/football-match-lab
          ref: main
          token: ${{ secrets.FOOTBALL_REPO_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build audited historical data
        if: inputs.task == 'historical-dataset'
        env:
          FOOTBALL_DATA_PERMISSION_REFERENCE: ${{ secrets.FOOTBALL_DATA_PERMISSION_REFERENCE }}
        run: |
          if ! python scripts/build_historical_dataset.py > .football-data.log 2>&1; then rm -f .football-data.log; echo "::error::Football dataset build failed; output suppressed."; exit 1; fi
          rm -f .football-data.log
          if [ -n "$FOOTBALL_DATA_PERMISSION_REFERENCE" ]; then python scripts/build_market_odds.py > .football-market.log 2>&1 || { rm -f .football-market.log; echo "::error::Market data build failed."; exit 1; }; rm -f .football-market.log; fi
          python scripts/audit_match_dataset.py >/dev/null
          python scripts/audit_stats_linkage.py >/dev/null
          python -c "from pathlib import Path; bad=[str(p) for p in Path('data').rglob('*') if p.is_file() and 'raw' not in p.parts and p.name!='upstream_games.parquet' and p.stat().st_size>=95000000]; assert not bad, bad"
          git add data/historical/top3_matches* data/historical/*.json data/fixtures/ data/market/ data/stats/
          git diff --cached --quiet || { git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git commit -m 'Refresh audited Football data snapshot'; git pull --rebase origin main; git push origin HEAD:main; }
      - name: Collect historical player data
        if: inputs.task == 'collect-player-data'
        run: |
          if ! python scripts/collect_external_player_data.py > .football-player.log 2>&1; then rm -f .football-player.log; echo "::error::Football player data collection failed; output suppressed."; exit 1; fi
          rm -f .football-player.log
          python -c "from pathlib import Path; bad=[str(p) for p in Path('data/external').rglob('*') if p.is_file() and p.stat().st_size>=95000000]; assert not bad, bad"
          git add data/external/
          git diff --cached --quiet || { git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git commit -m 'Refresh Football player archives'; git pull --rebase origin main; git push origin HEAD:main; }
