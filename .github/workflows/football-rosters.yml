name: Football player rosters
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-football-feed
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.PUBLIC_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/football-match-lab
          ref: main
          token: ${{ secrets.FOOTBALL_REPO_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyarrow requests
      - name: Fetch roster snapshot
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          if ! python scripts/build_active_players.py > .rosters.log 2>&1; then rm -f .rosters.log; echo "::error::Roster refresh failed; output suppressed."; exit 1; fi
          rm -f .rosters.log
          if [ ! -f data/players/current_players.csv.gz ]; then echo "No new roster file; nothing to publish."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/players/current_players.csv.gz data/players/current_players.parquet data/players/coverage.json
          if git diff --cached --quiet; then echo "Roster snapshot unchanged."; exit 0; fi
          git commit -m 'Refresh current Football league rosters'
          git pull --rebase origin main
          git push origin HEAD:main
