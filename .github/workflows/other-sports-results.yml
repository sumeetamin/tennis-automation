name: Other sports results
on:
  schedule:
    - cron: '50 18 * * *' # 12:20 AM IST
    - cron: '0 */8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-other-sports-feed
  cancel-in-progress: false
jobs:
  settle:
    if: ${{ vars.PUBLIC_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/tennis
          ref: main
          path: private
          token: ${{ secrets.TENNIS_REPO_TOKEN }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/elite-volleyball-dataset
          ref: main
          path: private/volleyball-data
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Settle and publish basketball and volleyball results
        working-directory: private
        run: |
          python -m pip install requests pandas
          set +e
          python basketball_results.py > .nba-results.log 2>&1; nba=$?
          python volleyball_results.py > .volleyball-results.log 2>&1; vb=$?
          rm -f .nba-results.log .volleyball-results.log
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ "$nba" -eq 0 ] && python -m json.tool api/basketball_history.json >/dev/null && git add api/basketball_history.json
          [ "$vb" -eq 0 ] && python -m json.tool api/volleyball_history.json >/dev/null && git add -f api/volleyball_history.json
          if git diff --cached --quiet; then echo "No results changes."; exit 0; fi
          git commit -m 'Refresh other sports results'
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git rebase -X ours origin/main
            if git push origin HEAD:main; then
              [ "$nba" -eq 0 ] || echo "::error::Basketball result refresh failed."
              [ "$vb" -eq 0 ] || echo "::error::Volleyball result refresh failed."
              [ "$nba" -eq 0 ] && [ "$vb" -eq 0 ] && exit 0 || exit 1
            fi
            sleep 2
          done
          echo "::error::Could not publish results."; exit 1
