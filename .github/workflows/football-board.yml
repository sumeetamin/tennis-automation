name: Football predictions
on:
  schedule:
    - cron: '45 18 * * *' # 12:15 AM IST
    - cron: '15 */8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-football-feed
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ vars.PUBLIC_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/football-match-lab
          ref: main
          token: ${{ secrets.FOOTBALL_REPO_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install locked Football dependencies
        run: python -m pip install -r requirements.lock
      - name: Generate and publish Football board
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: '2'
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if ! python scripts/publish_website_board.py > .football-board.log 2>&1; then rm -f .football-board.log; echo "::error::Football prediction refresh failed; private output suppressed."; exit 1; fi
          rm -f .football-board.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json site/history.json data/fixtures/upcoming.parquet data/champions/upcoming.parquet data/historical/top3_matches.parquet data/champions/matches.parquet
          if git diff --cached --quiet; then echo "Football feed unchanged."; exit 0; fi
          git commit -m 'Publish daily Football predictions'
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then echo "Football feed published."; exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          echo "::error::Could not publish Football feed."; exit 1
