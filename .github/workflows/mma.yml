name: MMA predictions
on:
  schedule:
    - cron: '31 18 * * *' # 12:01 AM IST
    - cron: '15 0,8,16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-mma-feed
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.PUBLIC_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/tennis
          ref: main
          path: private
          token: ${{ secrets.TENNIS_REPO_TOKEN }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/mma-dataset
          ref: main
          path: private/mma-data
          token: ${{ secrets.MMA_REPOS_READ_TOKEN }}
          lfs: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/MMA-
          ref: main
          path: private/mma-model
          token: ${{ secrets.MMA_REPOS_READ_TOKEN }}
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install and run private MMA model
        working-directory: private
        run: |
          show_failure_log() {
            label="$1"
            log="$2"
            echo "::group::${label} failure details (last 80 lines; credentials redacted)"
            if [ -f "$log" ]; then
              python - "$log" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          for pattern, replacement in (
              (r"(?i)(bearer\s+)[^\s]+", r"\1[REDACTED]"),
              (r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b", "[REDACTED_TOKEN]"),
              (r"\bgithub_pat_[A-Za-z0-9_]{20,}\b", "[REDACTED_TOKEN]"),
              (r"(?i)([?&](?:token|api_key|apikey|key|authorization)=)[^&\s]+", r"\1[REDACTED]"),
          ):
              text = re.sub(pattern, replacement, text)
          lines = text.splitlines()
          print("\n".join(lines[-80:]) if lines else "(log was empty)")
          PY
            else
              echo "Log file not found: $log"
            fi
            echo "::endgroup::"
          }
          python -m pip install -r mma-model/requirements.txt requests
          if ! python mma-data/scripts/build_ufc_snapshot.py > .mma-build.log 2>&1; then show_failure_log "MMA data preparation" .mma-build.log; rm -f .mma-build.log; exit 1; fi
          rm -f .mma-build.log
          if ! python mma-model/train.py --dataset mma-data --test-bouts 2500 > .mma-train.log 2>&1; then show_failure_log "MMA model training" .mma-train.log; rm -f .mma-train.log; exit 1; fi
          rm -f .mma-train.log
          if ! python mma_refresh.py > .mma-refresh.log 2>&1; then show_failure_log "MMA predictions refresh" .mma-refresh.log; rm -f .mma-refresh.log; exit 1; fi
          rm -f .mma-refresh.log
          python -m json.tool api/mma_data.json >/dev/null
          python -m json.tool api/mma_history.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/mma_data.json api/mma_history.json
          if git diff --cached --quiet; then echo "No MMA feed changes."; exit 0; fi
          git commit -m 'Refresh MMA predictions and history'
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git rebase -X ours origin/main
            if git push origin HEAD:main; then echo "MMA feeds published."; exit 0; fi
            sleep 2
          done
          echo "::error::Could not publish MMA feeds."; exit 1
