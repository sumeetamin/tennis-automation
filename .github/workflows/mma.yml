name: MMA predictions
on:
  schedule:
    - cron: '31 18 * * *' # 12:01 AM IST
    - cron: '15 0,8,16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-mma-feed
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.PUBLIC_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/tennis
          ref: main
          path: private
          token: ${{ secrets.TENNIS_REPO_TOKEN }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/mma-dataset
          ref: main
          path: private/mma-data
          token: ${{ secrets.MMA_REPOS_READ_TOKEN }}
          lfs: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/MMA-
          ref: main
          path: private/mma-model
          token: ${{ secrets.MMA_REPOS_READ_TOKEN }}
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install and run private MMA model
        working-directory: private
        run: |
          python -m pip install -r mma-model/requirements.txt requests
          if ! python mma-data/scripts/build_ufc_snapshot.py > .mma-build.log 2>&1; then rm -f .mma-build.log; echo "::error::MMA data preparation failed; output suppressed."; exit 1; fi
          rm -f .mma-build.log
          if ! python mma-model/train.py --dataset mma-data --test-bouts 2500 > .mma-train.log 2>&1; then rm -f .mma-train.log; echo "::error::MMA model training failed; output suppressed."; exit 1; fi
          rm -f .mma-train.log
          if ! python mma_refresh.py > .mma-refresh.log 2>&1; then rm -f .mma-refresh.log; echo "::error::MMA refresh failed; output suppressed."; exit 1; fi
          rm -f .mma-refresh.log
          python -m json.tool api/mma_data.json >/dev/null
          python -m json.tool api/mma_history.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/mma_data.json api/mma_history.json
          if git diff --cached --quiet; then echo "No MMA feed changes."; exit 0; fi
          git commit -m 'Refresh MMA predictions and history'
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git rebase -X ours origin/main
            if git push origin HEAD:main; then echo "MMA feeds published."; exit 0; fi
            sleep 2
          done
          echo "::error::Could not publish MMA feeds."; exit 1
