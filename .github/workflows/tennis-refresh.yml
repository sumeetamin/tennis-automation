name: Tennis predictions
on:
  schedule:
    - cron: '31 18 * * *' # 12:01 AM IST
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-tennis-feed
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.PUBLIC_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sumeetamin/tennis
          ref: main
          path: private
          token: ${{ secrets.TENNIS_REPO_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install private model dependencies
        working-directory: private
        run: python -m pip install -r requirements.txt
      - name: Generate predictions
        working-directory: private
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          TENNIS_RESULTS_API_KEY: ${{ secrets.TENNIS_RESULTS_API_KEY }}
          TENNIS_RESULTS_API_KEYS: ${{ secrets.TENNIS_RESULTS_API_KEYS }}
          PYTHONUTF8: '1'
        run: |
          if python predict.py > .private-run.log 2>&1; then rm -f .private-run.log; echo "Prediction generation completed."
          else rm -f .private-run.log; echo "::error::Prediction generation failed; private output suppressed."; exit 1; fi
      - name: Publish private feeds for Vercel
        working-directory: private
        run: |
          if python scripts/publish_tennis_predictions.py > .private-publish.log 2>&1; then rm -f .private-publish.log; echo "Private tennis feeds published."
          else rm -f .private-publish.log; echo "::error::Feed publishing failed; private output suppressed."; exit 1; fi
